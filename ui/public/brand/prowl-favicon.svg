<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128">
  <!-- PROWL panther silhouette, derived from PROWL_LOGO.png (shape unchanged; colour follows the browser theme). -->
  <style>.mark{fill:#15181d} @media (prefers-color-scheme: dark){.mark{fill:#dcddd8}}</style>
  <mask id="m" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
    <image width="128" height="128" href="data:image/png;base64,"/>
  </mask>
  <rect class="mark" width="128" height="128" mask="url(#m)"/>
</svg>
