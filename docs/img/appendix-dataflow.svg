<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif"><rect width="720" height="250" fill="#ffffff"/><defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="25" y="28" width="158" height="58" rx="6" fill="#f4f6f8" stroke="#b9c0c7"/><text x="104.0" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#14171a">1. Scan arrives</text><text x="104.0" y="64" text-anchor="middle" font-size="10.5" fill="#5f5e5a">watch folder or POST</text><text x="104.0" y="77" text-anchor="middle" font-size="10.5" fill="#5f5e5a">triggers the pipeline</text><line x1="189" y1="57" x2="193" y2="57" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#b)"/><rect x="197" y="28" width="158" height="58" rx="6" fill="#e1f5ee" stroke="#0f6e56"/><text x="276.0" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#04342c">2. Localize</text><text x="276.0" y="64" text-anchor="middle" font-size="10.5" fill="#0f6e56">full volume at 1.5 mm,</text><text x="276.0" y="77" text-anchor="middle" font-size="10.5" fill="#0f6e56">predicted pancreas box</text><line x1="361" y1="57" x2="365" y2="57" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#b)"/><rect x="369" y="28" width="158" height="58" rx="6" fill="#e1f5ee" stroke="#0f6e56"/><text x="448.0" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#04342c">3. Crop</text><text x="448.0" y="64" text-anchor="middle" font-size="10.5" fill="#0f6e56">box plus 16 voxels,</text><text x="448.0" y="77" text-anchor="middle" font-size="10.5" fill="#0f6e56">resize to 128 cubed</text><line x1="533" y1="57" x2="537" y2="57" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#b)"/><rect x="541" y="28" width="158" height="58" rx="6" fill="#e1f5ee" stroke="#0f6e56"/><text x="620.0" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#04342c">4. Segment</text><text x="620.0" y="64" text-anchor="middle" font-size="10.5" fill="#0f6e56">SegResNet,</text><text x="620.0" y="77" text-anchor="middle" font-size="10.5" fill="#0f6e56">three-class output</text><rect x="25" y="134" width="158" height="58" rx="6" fill="#e1f5ee" stroke="#0f6e56"/><text x="104.0" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#04342c">5. Gate and measure</text><text x="104.0" y="170" text-anchor="middle" font-size="10.5" fill="#0f6e56">volume, diameter,</text><text x="104.0" y="183" text-anchor="middle" font-size="10.5" fill="#0f6e56">subregion, suspicion</text><line x1="189" y1="163" x2="193" y2="163" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#b)"/><rect x="197" y="134" width="158" height="58" rx="6" fill="#f4f6f8" stroke="#b9c0c7"/><text x="276.0" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#14171a">6. Persist</text><text x="276.0" y="170" text-anchor="middle" font-size="10.5" fill="#5f5e5a">finding row in Postgres,</text><text x="276.0" y="183" text-anchor="middle" font-size="10.5" fill="#5f5e5a">mask file on disk</text><line x1="361" y1="163" x2="365" y2="163" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#b)"/><rect x="369" y="134" width="158" height="58" rx="6" fill="#f4f6f8" stroke="#b9c0c7"/><text x="448.0" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#14171a">7. Worklist</text><text x="448.0" y="170" text-anchor="middle" font-size="10.5" fill="#5f5e5a">queue ordered by</text><text x="448.0" y="183" text-anchor="middle" font-size="10.5" fill="#5f5e5a">suspicion score</text><line x1="533" y1="163" x2="537" y2="163" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#b)"/><rect x="541" y="134" width="158" height="58" rx="6" fill="#e6f1fb" stroke="#185fa5"/><text x="620.0" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#042c53">8. Review</text><text x="620.0" y="170" text-anchor="middle" font-size="10.5" fill="#185fa5">overlay, assistant,</text><text x="620.0" y="183" text-anchor="middle" font-size="10.5" fill="#185fa5">accept / edit / reject</text><path d="M669 86 L690 86 L690 100 L20 100 L20 118 L25 118" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#b)"/><path d="M669 192 L690 192 L690 214 L200 214 L200 196" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#b)"/><text x="420" y="232" text-anchor="middle" font-size="10.5" fill="#5f5e5a">reviewer decisions return to the database as a corrections record</text></svg>